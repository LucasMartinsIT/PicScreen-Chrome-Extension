<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PicScreen</title>
    <style>
      /* Base & Reset */
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        width: 340px;
        height: 550px;
        overflow-y: auto;
        padding: 15px;
        margin: 0;
        background-color: #222;
        color: #fff;
      }
      h2 {
        font-size: 16px;
        text-align: center;
        margin-top: 0;
      }

      /* Layout & Controls */
      .top-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        align-items: flex-end;
      }
      .input-group {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .input-group label {
        font-size: 11px;
        margin-bottom: 4px;
        font-weight: bold;
        color: #aaa;
      }
      .input-group input {
        width: 50px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #444;
        background-color: #333;
        color: white;
        text-align: center;
        font-weight: bold;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #8a2be2;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .top-controls button {
        margin-bottom: 0;
        flex: 1;
      }

      /* Collapsible Sections */
      .section-title {
        font-size: 12px;
        font-weight: bold;
        margin: 15px 0 5px 0;
        color: #ffdd00;
        border-bottom: 1px solid #444;
        padding-bottom: 3px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
      }
      .section-title:hover {
        color: #fff;
      }
      .collapsed {
        display: none !important;
      }

      /* Color Palettes */
      .palette-container {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        margin-bottom: 10px;
      }
      .color-box {
        width: 100%;
        height: 45px;
        border-radius: 4px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        cursor: pointer;
        padding-bottom: 5px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .color-box span {
        background: rgba(0, 0, 0, 0.7);
        padding: 2px 4px;
        border-radius: 3px;
        font-size: 9px;
        font-family: monospace;
      }

      /* Image Gallery */
      .gallery {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 15px;
      }
      .img-container {
        position: relative;
        width: 100%;
      }
      .img-container img {
        width: 100%;
        height: auto;
        border-radius: 4px;
        display: block;
        object-fit: cover;
      }
      .btn-single-down {
        position: absolute;
        bottom: 5px;
        right: 5px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        padding: 4px 6px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
        width: auto;
        margin: 0;
      }
      .btn-single-down:hover {
        background-color: #28a745;
        border-color: #28a745;
      }

      /* Pagination Controls */
      .pagination-controls {
        display: none;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
      }
      .pagination-controls button {
        width: 45%;
        margin-bottom: 0;
        background-color: #444;
      }
      .pagination-controls button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Footer */
      .footer {
        margin-top: 20px;
        text-align: center;
        font-size: 12px;
        border-top: 1px solid #444;
        padding-top: 10px;
        padding-bottom: 15px;
      }
      .footer a {
        color: #ffdd00;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>PicScreen 🎨</h2>

    <!-- Main Controls -->
    <div class="top-controls">
      <div class="input-group">
        <label for="palette-limit" id="label-colors">Cores</label>
        <input
          type="number"
          id="palette-limit"
          value="10"
          min="1"
          max="100"
          title="Quantidade de cores"
        />
      </div>
      <button id="btn-extract">Analisar Página</button>
    </div>

    <button
      id="btn-download"
      style="background-color: #28a745; margin-bottom: 5px; display: none"
    >
      Baixar Tudo em .ZIP
    </button>

    <!-- Eyedropper Section -->
    <div class="section-title" id="title-eyedropper">
      Conta-gotas (Cor Específica)
    </div>
    <div style="display: flex; gap: 10px; margin-bottom: 15px">
      <button
        id="btn-eyedropper"
        style="background-color: #0078d7; margin: 0; flex: 2"
      >
        Pegar cor
      </button>
      <div
        id="eyedropper-result"
        class="color-box"
        style="
          flex: 1;
          margin: 0;
          background-color: #444;
          border: 1px dashed #777;
        "
      >
        <span>Vazio</span>
      </div>
    </div>

    <!-- Site Palette (UI/CSS) -->
    <div class="section-title" id="toggle-site-palette">
      <span id="title-site-palette">Paleta do Site (Design)</span>
      <span class="arrow">▼</span>
    </div>
    <div id="site-palette-container" class="palette-container"></div>

    <!-- Image Palette (Canvas) -->
    <div class="section-title" id="toggle-image-palette">
      <span id="title-image-palette">Paleta das Imagens (Arte)</span>
      <span class="arrow">►</span>
    </div>
    <div id="image-palette-container" class="palette-container collapsed"></div>

    <!-- Image Gallery & Pagination -->
    <div id="gallery" class="gallery"></div>

    <div id="pagination-controls" class="pagination-controls">
      <button id="btn-prev">Anterior</button>
      <span id="page-info">1/1</span>
      <button id="btn-next">Próxima</button>
    </div>

    <!-- Footer -->
    <div class="footer" id="footer-content">
      ☕ Saved your time?
      <a href="https://ko-fi.com/lucasmartins1991" target="_blank"
        >Buy me a coffee!</a
      >
    </div>

    <!-- Scripts -->
    <script src="jszip.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
